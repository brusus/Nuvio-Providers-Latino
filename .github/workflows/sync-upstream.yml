name: Sync Upstream

# Questo repo e' un fork: non ha sorgente proprio da riscrivere (i domini
# sono fissi dentro i bundle in providers/), quindi l'auto-aggiornamento qui
# significa prendere i nuovi commit dal vero upstream (SPECTRUM00-prog, non
# KennethJYS: quest'ultimo e' tornato a una versione precedente, il fork
# reale che questo repo segue e' l'altro). Gira ogni hora e a mano.
#
# Il repo e' "mirror + 1 commit locale": questo workflow stesso vive qui e
# upstream non lo ha, quindi main NON e' mai un antenato puro di
# upstream/main e `merge --ff-only` fallisce sempre (e' perche' l'old
# workflow e' rimasto rosso). La strategia e' quindi: rebase del commit
# locale sopra l'upstream, poi push con --force-with-lease (sicuro: non
# sovrascrive push altrui). Storicamente lineare, nessun commit di merge
# oraria; se un giorno upstream tocca .github/ in conflitto il rebase
# fallisce rumorosamente invece di perdere il workflow.

on:
  schedule:
    - cron: "23 * * * *"   # ogni ora, al minuto 23
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizza con l'upstream (rebase del commit locale, force-with-lease)
        env:
          # Il rebase di un commit generato da Actions su una base nuova
          # cambia hash/author: serve un'identity configurata, altrimenti
          # git si rifiuta di far partire il rebase.
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git remote add upstream https://github.com/SPECTRUM00-prog/Nuvio-Providers-Latino.git
          git fetch upstream main
          AHEAD=$(git rev-list --count HEAD..upstream/main)
          if [ "$AHEAD" = "0" ]; then
            echo "Nessun aggiornamento da upstream."
            exit 0
          fi
          echo "$AHEAD nuovi commit da upstream, rebase del commit locale sopra l'upstream..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase upstream/main
          # --force-with-lease: sovrascrive main solo se non e' cambiata
          # rispetto a quanto abbiamo letto col checkout (non spara mai
          # push fatti da altri nel frattempo).
          git push --force-with-lease origin main
          echo "Sync completato."
